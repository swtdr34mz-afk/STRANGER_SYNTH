# STRANGER SYNTH build settings (fm1-base tools/build.py). The pixel type of the screens: X0X_FONTSET=terminus in the
# environment (the workflow sets it; for a local build: X0X_FONTSET=terminus python3 fm1-base/tools/build.py . --host)
name = "stranger_synth"           # the build's file names: stranger_synth-0.1.fwsc, build/host/stranger_synth_host
title = "STRANGER SYNTH"                # the name people see (firmware hubs)
id_prefix = "FM-1_576"            # package identity: dev FM-1_57600, releases FM-1_576 + XXYYZZ (CHORD RUN 571, GRAIN PIANO 572, INSERT COIN 573, SIX MACHINES 574, OFFWORLD 575)
usb_manufacturer = "swtdr34mz"
usb_product = "STRANGER SYNTH FM-1"     # the USB name (the MIDI port in a DAW)
o2 = ["dsp/engine.c"]             # the sound engine, at -O2
include = ["dsp"]
vendored = ["fm1-base/"]          # fm1-base is a submodule inside the app: its own checks are its own
words = "words.tsv"
ble = false
cpu2 = true                       # half the voices on the second core
cpu2_fallback = true              # a unit whose second core fails: one core, no restart
backup = true                     # backup and restore of the settings
tagline = "A performance synth: 80s analogue poly sounds, arps, a low split, tape and VHS effects"
repo = "https://github.com/swtdr34mz-afk/STRANGER_SYNTH"
licence = "MPL-2.0"
credits = "Based on OFFWORLD (swtdr34mz). Built on fm1-base (Charles Vestal) and felucca-bsp (Leo Kuroshita, Hügelton Instruments)."
author = "swtdr34mz"
description = "A performance synth in the spirit of 80s analogue film scores: classic poly and mono sounds, an arpeggiator, a low split the melody follows, chords with sidechain, tape and VHS performance effects. Work in progress, based on OFFWORLD."
tags = ["synth", "chords"]
install = "https://github.com/swtdr34mz-afk/STRANGER_SYNTH/releases"
screenshot = "site/img/screen-main.png"
